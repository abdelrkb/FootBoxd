name: football-app

# Remplace abdelrkb par ton user/organisation GitHub EN MINUSCULES (exigence de ghcr.io).
# Aucun "ports:" ici : seul Caddy (dans /opt/proxy) est exposé sur Internet.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: football_app
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d football_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]

  api:
    image: ghcr.io/abdelrkb/football-app-api:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      internal:
      proxy:
        aliases: [football-api]

  worker:
    image: ghcr.io/abdelrkb/football-app-worker:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [internal]

  web:
    image: ghcr.io/abdelrkb/football-app-web:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on: [api]
    networks:
      internal:
      proxy:
        aliases: [football-web]

volumes:
  pgdata:

networks:
  internal:
  proxy:
    external: true