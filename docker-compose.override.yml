services:
  api:
    command: npm run start:dev --workspace=@football-app/api
    volumes:
      - ./apps/api:/repo/apps/api
      - ./packages:/repo/packages
      - /repo/apps/api/node_modules
      - /repo/node_modules
    environment:
      NODE_ENV: development

  worker:
    command: npm run dev --workspace=@football-app/worker
    volumes:
      - ./apps/worker:/repo/apps/worker
      - ./packages:/repo/packages
      - /repo/apps/worker/node_modules
      - /repo/node_modules
    environment:
      NODE_ENV: development

  web:
    command: npm run dev --workspace=@football-app/web
    volumes:
      - ./apps/web:/repo/apps/web
      - ./packages:/repo/packages
      - /repo/apps/web/node_modules
      - /repo/node_modules
    environment:
      NODE_ENV: development
