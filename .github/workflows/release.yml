name: Release

# Publier une Release GitHub (avec son tag vX.Y.Z) build les images et déploie ce tag sur le VPS.
# Merger dans main ne déploie rien.
#
# Rollback : Actions → Release → Run workflow → tag = v1.1.0 (redéploie ce tag, sans rebuild).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à (re)déployer, ex. v1.1.0 (rollback, sans rebuild)"
        required: true
        type: string

# Un seul déploiement à la fois.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/abdelrkb/football-app

jobs:
  prepare:
    # Les pré-releases sont ignorées (ni build ni déploiement).
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Déterminer et valider le tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then TAG="$DISPATCH_TAG"; else TAG="$RELEASE_TAG"; fi
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag invalide : '$TAG' (attendu vX.Y.Z)"; exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: prepare
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ needs.prepare.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          build-args: |
            ${{ matrix.app == 'web' && 'NEXT_PUBLIC_API_URL=/api' || '' }}

  deploy:
    needs: [prepare, build-and-push]
    # always() : en workflow_dispatch (rollback), build-and-push est skippé.
    if: |
      always() && needs.prepare.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.build-and-push.result == 'success')
    runs-on: ubuntu-latest
    steps:
      # On déploie le compose du tag demandé (pas celui de la branche courante).
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Copier le compose de prod sur le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /opt/apps/football-app

      - name: Déployer
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/apps/football-app
            sed -i '/^TAG=/d' .env && echo "TAG=${{ needs.prepare.outputs.tag }}" >> .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm -w /repo/packages/database api npx prisma migrate deploy
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
