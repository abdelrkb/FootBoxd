name: Release

# Merger dans main ne déploie plus : release-please ouvre/maintient une PR de release ; c'est le
# merge de CETTE PR (création du tag vX.Y.Z) qui build, pousse les images et déploie.
# Tout est dans le MÊME workflow car un tag créé avec GITHUB_TOKEN ne déclenche aucun autre workflow.
#
# Rollback : Actions → Release → Run workflow → tag = v1.1.0 (redéploie ce tag, sans rebuild).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à (re)déployer, ex. v1.1.0 (rollback, sans rebuild)"
        required: true
        type: string

env:
  IMAGE_PREFIX: ghcr.io/abdelrkb/football-app

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-push:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ needs.release-please.outputs.tag_name }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          build-args: |
            ${{ matrix.app == 'web' && 'NEXT_PUBLIC_API_URL=/api' || '' }}

  deploy:
    needs: [release-please, build-and-push]
    # always() : en workflow_dispatch (rollback), release-please et build-and-push sont skippés.
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (needs.release-please.outputs.release_created == 'true' && needs.build-and-push.result == 'success')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Déterminer et valider le tag à déployer
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then TAG="$DISPATCH_TAG"; else TAG="$RELEASE_TAG"; fi
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag invalide : '$TAG' (attendu vX.Y.Z)"; exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      # En rollback, on déploie le compose du tag demandé (pas celui de la branche courante).
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.value }}

      - name: Copier le compose de prod sur le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /opt/apps/football-app

      - name: Déployer
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/apps/football-app
            sed -i '/^TAG=/d' .env && echo "TAG=${{ steps.tag.outputs.value }}" >> .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm -w /repo/packages/database api npx prisma migrate deploy
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
